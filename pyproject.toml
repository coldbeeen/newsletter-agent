[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "newsletter-agent"
version = "0.1.0"
description = "네이버 메일 뉴스레터 데일리 요약 에이전트"
requires-python = ">=3.11"
dependencies = [
    "imap-tools>=1.5",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "anthropic>=0.40",
    "python-dotenv>=1.0",
    "tenacity>=8.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.14",
    "respx>=0.21",
    "freezegun>=1.5",
    "ruff==0.16.2",
]

[project.scripts]
newsletter-agent = "newsletter_agent.pipeline:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
# 프로젝트 코드의 한글 주석/문자열 비중이 높아 88자 기본값은 대부분 한글 줄에서
# 불필요하게 걸린다. 실측(2026-08-13) 결과 최대 120자, 100자 초과는 14건뿐이라
# 110자로 고정하면 대다수는 자연히 해소되고 나머지 소수만 실제로 손보게 된다.
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "DTZ", "UP", "RUF"]
